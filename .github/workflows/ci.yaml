name: CI

on:
  - push
  - pull_request

permissions:
  actions: write
  contents: read

jobs:
  check:
    name: Check

    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install libraries
        run: sudo apt-get update && sudo apt-get install --yes libxkbcommon-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rustfmt

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check code
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Check optional runtime features
        run: |
          cargo check --locked -p meowland-protocol --no-default-features
          cargo check --locked -p meowland-protocol --features async

      - name: Run tests
        run: cargo test --locked --workspace --all-features

      - name: Check documentation
        run: cargo doc --locked --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  dependencies:
    name: Check dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install audit tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny,cargo-machete

      - name: Audit vulnerabilities
        run: cargo audit --deny warnings

      - name: Check licenses and sources
        run: cargo deny --locked check

      - name: Check unused dependencies
        run: cargo machete --with-metadata

  check-nix:
    name: Check Nix

    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Check flake
        run: nix flake check

  build:
    name: Build

    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Build the compositor
        run: nix build .#default

      - name: Smoke-test the binary
        run: ./result/bin/meowland --help
