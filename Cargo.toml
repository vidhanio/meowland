[package]
name = "meowland"
version = "0.1.0"
edition = "2024"

license = "AGPL-3.0-or-later"
publish = false

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
bincode = { version = "2.0.1", default-features = false, features = [
  "serde",
  "std",
] }
crossterm = { version = "0.29.0", default-features = false, features = [
  "bracketed-paste",
  "events",
] }
flate2 = "1.1.10"
evdev = "0.13.2"
nutype = { version = "0.7.0", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_bytes = "0.11.19"
calloop = { version = "0.14.4", features = ["signals"] }
rustix = { version = "1.1.4", features = ["net", "process", "runtime", "shm"] }
smithay = { version = "0.7", default-features = false, features = [
  "desktop",
  "renderer_gl",
  "wayland_frontend",
] }
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
  "env-filter",
  "fmt",
] }
usage = { package = "usage-rs", version = "6.9.1", default-features = false, features = [
  "completions",
  "diagnostics",
  "help",
] }

[lints]
[lints.rust]
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
# missing_docs = "warn"
# Not `forbid`: a client's buffer is read through a raw pointer, in shared
# memory and in a mapped GPU buffer, and both reads need an `unsafe` slice
# (`src/buffer.rs`).
unsafe_code = "deny"

[lints.clippy]
# Pointer positions, frame rectangles and channel arithmetic convert between
# number types in bulk. The range is known from the invariants around the code,
# not from the type.
cast_possible_wrap = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"

missing_errors_doc = "allow"
module_name_repetitions = "allow"

nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
