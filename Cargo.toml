[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.metadata.crane]
name = "meowland"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
meowland-core = { path = "crates/meowland-core" }
meowland-input = { path = "crates/meowland-input" }
meowland-terminal-clipboard = { path = "crates/meowland-terminal-clipboard" }
meowland-render = { path = "crates/meowland-render" }
meowland-protocol = { path = "crates/meowland-protocol" }
meowland-kitty = { path = "crates/meowland-kitty" }
meowland-terminal = { path = "crates/meowland-terminal" }
meowland-compositor = { path = "crates/meowland-compositor" }
meowland-server = { path = "crates/meowland-server" }
base64 = "0.23.1"
calloop = "0.14.5"
postcard = { version = "1.1.3", default-features = false }
crossterm = { git = "https://github.com/crossterm-rs/crossterm.git", rev = "78eff60fdcfdf62ef9247c13d18e2c9de9452750", default-features = false }
flate2 = "1.1.10"
libloading = "0.9.0"
mime = "0.3.17"
vtparse = "0.7.0"
getrandom = { version = "0.4.3", default-features = false }
serde = "1.0.229"
serde_bytes = "0.11.19"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-journald = "0.3.2"
tracing-subscriber = "0.3.23"
rustix = "1.1.5"
tokio = "1.54.1"
smithay = { git = "https://github.com/Smithay/smithay.git", rev = "76118ad7796e3edc46875f44c437485996a8e39d", default-features = false }
usage-rs = { version = "7.1.3", default-features = false }
sd-notify = "0.5.0"
listenfd = "1.0.2"
drm = "0.15.0"
memmap2 = "0.9.12"
wayland-client = "0.31.15"
wayland-protocols = "0.32.13"

[workspace.lints.rust]
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
redundant_pub_crate = "allow"
unwrap_used = "warn"
expect_used = "allow"
panic_in_result_fn = "warn"
missing_panics_doc = "warn"
missing_errors_doc = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
fn_params_excessive_bools = "warn"
struct_excessive_bools = "warn"
clone_on_ref_ptr = "warn"
redundant_clone = "warn"
rc_buffer = "warn"
string_add = "warn"
wildcard_imports = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"
as_conversions = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
module_inception = "allow"
enum_glob_use = "allow"
