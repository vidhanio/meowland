[package]
name = "meowland-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[lib]
bench = false

[[bin]]
name = "meowland-workload"
path = "src/bin/meowland-workload/main.rs"
bench = false

[[bench]]
name = "suite"
harness = false

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
flate2 = { workspace = true }
rustix = { workspace = true, features = [
  "event",
  "fs",
  "process",
  "pty",
  "termios",
  "time",
] }
tempfile = { workspace = true }
wayland-client = { workspace = true }
wayland-protocols = { workspace = true, features = ["client"] }

[dev-dependencies]
criterion = { workspace = true }
