[package]
name = "meowland-compositor"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
meowland-readback = { workspace = true }
meowland-render = { workspace = true }
meowland-core = { workspace = true }
meowland-loop = { workspace = true }
meowland-panes = { workspace = true }
meowland-protocol = { workspace = true }
meowland-selection = { workspace = true }
meowland-settings = { workspace = true }
calloop = { workspace = true }
rustix = { workspace = true }
smithay = { workspace = true, features = [
  "wayland_frontend",
  "desktop",
  "backend_drm",
  "renderer_gl",
] }
tracing = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
rustix = { workspace = true, features = ["fs"] }
wayland-client = { workspace = true }
wayland-protocols = { workspace = true, features = ["client"] }
