sd-notify = { workspace = true }
serde = { workspace = true }
postcard = { workspace = true, features = ["use-std"] }
tokio = { workspace = true, features = [
  "io-util",
  "macros",
  "net",
  "process",
  "rt",
  "signal",
  "sync",
  "time",
] }
tracing = { workspace = true }
