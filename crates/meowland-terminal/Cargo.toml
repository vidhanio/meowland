[package]
name = "meowland-terminal"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
fuzzing = []

[dependencies]
meowland-input = { workspace = true }
base64 = { workspace = true }
meowland-core = { workspace = true }
meowland-async = { workspace = true }
meowland-protocol = { workspace = true, features = ["async"] }
calloop = { workspace = true }
futures = { workspace = true }
flate2 = { workspace = true }
crossterm = { workspace = true, features = ["events"] }
rustix = { workspace = true, features = ["fs", "termios"] }
thiserror = { workspace = true }
tracing = { workspace = true }
vtparse = { workspace = true }
