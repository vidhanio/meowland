[package]
name = "meowland-terminal"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
meowland-input = { workspace = true }
meowland-terminal-clipboard = { workspace = true }
meowland-core = { workspace = true, features = ["async"] }
meowland-protocol = { workspace = true, features = ["async"] }
tokio = { workspace = true, features = [
  "io-util",
  "macros",
  "net",
  "rt",
  "signal",
  "time",
] }
meowland-kitty = { workspace = true }
crossterm = { workspace = true, features = ["bracketed-paste", "events"] }
rustix = { workspace = true, features = ["fs"] }
tracing = { workspace = true }
vtparse = { workspace = true }
