[package]
name = "meowland"
default-run = "meowland"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
benchmarks = ["dep:rustix", "dep:wayland-client", "dep:wayland-protocols"]

[[bin]]
name = "meowland-workload"
path = "benchmarks/workload/main.rs"
required-features = ["benchmarks"]

[[bench]]
name = "suite"
path = "benchmarks/suite.rs"
harness = false
required-features = ["benchmarks"]

[dependencies]
rustix = { workspace = true, optional = true, features = [
  "event",
  "fs",
  "time",
] }
wayland-client = { workspace = true, optional = true }
wayland-protocols = { workspace = true, optional = true, features = ["client"] }
dirs = { workspace = true }
meowland-core = { workspace = true }
meowland-compositor = { workspace = true }
meowland-protocol = { workspace = true }
meowland-server = { workspace = true }
meowland-terminal = { workspace = true }
toml = { workspace = true }
tracing-journald = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
usage-rs = { workspace = true, features = [
  "completions",
  "diagnostics",
  "help",
] }
