[package]
name = "meowland"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
meowland-core = { workspace = true, features = ["async"] }
meowland-protocol = { workspace = true, features = ["async"] }
meowland-server = { workspace = true }
meowland-terminal = { workspace = true }
flate2 = { workspace = true }
russh = { workspace = true, features = ["ring", "rsa"] }
russh-config = { workspace = true }
rustix = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_bytes = { workspace = true }
tokio = { workspace = true, features = [
  "io-util",
  "macros",
  "net",
  "rt",
  "sync",
  "time",
] }
tracing-journald = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
usage-rs = { workspace = true, features = [
  "completions",
  "diagnostics",
  "help",
] }
