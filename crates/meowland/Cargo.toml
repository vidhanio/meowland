[package]
name = "meowland"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
meowland-core = { workspace = true }
meowland-protocol = { workspace = true }
meowland-server = { workspace = true }
meowland-terminal = { workspace = true }
tokio = { workspace = true, features = ["rt", "time"] }
tracing-journald = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
usage-rs = { workspace = true, features = [
  "completions",
  "diagnostics",
  "help",
] }

[dev-dependencies]
base64 = { workspace = true }
flate2 = { workspace = true }
pty-process = { workspace = true }
rustix = { workspace = true, features = ["event", "fs", "shm", "termios", "time"] }
tempfile = { workspace = true }
vtparse = { workspace = true }
wayland-client = { workspace = true }
wayland-protocols = { workspace = true, features = ["client"] }

[[bench]]
name = "suite"
harness = false
