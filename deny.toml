[graph]
all-features = true

[advisories]
unmaintained = "workspace"
yanked = "deny"

[licenses]
allow = ["MIT", "Apache-2.0", "ISC", "Unicode-3.0", "Zlib"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
  "https://github.com/Smithay/smithay.git",
  "https://github.com/crossterm-rs/crossterm.git",
]
required-git-spec = "rev"
